<!doctype html>
<html>

<head>
    <meta charset="UTF-8">
    <title>DataBus | Sensor</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="grafico.css">
</head>

<body class="sem-rolagem">

    <header class="barra-topo">
        <div class="logo">
            <img src="../../site/login-cadastro/imgs/Símbolo.png" alt="Logo DataBus">
            <p>DATA<span>BUS</span></p>
        </div>
        <p class="barra-topo-texto">Monitoramento em tempo real</p>
    </header>

    <main class="conteudo">
        <span class="etiqueta">SENSOR DE PRESENÇA</span>
        <h1 class="titulo-pagina">Leituras do sensor</h1>
        <p class="texto">
            Cada ponto é uma leitura enviada pelo Arduino. A linha sobe quando o sensor
            detecta alguém (1) e desce quando não detecta nada (0).
        </p>

        <div class="cartao-grafico">
            <h2 class="titulo-grafico">Gráfico em tempo real</h2>
            <div class="area-grafico">
                <canvas id="sensorDigital"></canvas>
            </div>
        </div>
    </main>

    <footer class="rodape">DataBus - Monitoramento da ocupação de ônibus</footer>

    <script>
        // textos cinza e linhas de grade claras para o fundo branco
        Chart.defaults.color = 'slategray';
        Chart.defaults.borderColor = 'gainsboro';
        Chart.defaults.font.family = 'Inter';

        var sensorDigital = new Chart(document.getElementById('sensorDigital').getContext('2d'), {
            type: 'line',
            data: {
                datasets: [{
                    label: 'Presença detectada',
                    borderColor: 'royalblue',
                    borderWidth: 3,
                    backgroundColor: 'aliceblue',
                    fill: true,
                    pointBackgroundColor: 'goldenrod',
                    pointBorderColor: 'goldenrod',
                    pointRadius: 5
                }]
            },
            options: {
                maintainAspectRatio: false,
                scales: {
                    x: {
                        beginAtZero: true
                    },
                    y: {
                        title: {
                            display: true,
                            text: '(0-1)'
                        },
                        beginAtZero: true,
                        max: 1,
                        ticks: {
                            stepSize: 1
                        }
                    }
                }
            }
        });

        var paginacao = {};
        var tempo = {};

        function obterDados(grafico, endpoint) {
            fetch('http://localhost:3300/sensores/' + endpoint)
                .then(response => response.json())
                .then(valores => {
                    if (paginacao[endpoint] == null) {
                        paginacao[endpoint] = 0;
                    }
                    if (tempo[endpoint] == null) {
                        tempo[endpoint] = 0;
                    }

                    var ultimaPaginacao = paginacao[endpoint];
                    paginacao[endpoint] = valores.length;
                    valores = valores.slice(ultimaPaginacao);

                    valores.forEach((valor) => {
                        if (grafico.data.labels.length == 10 && grafico.data.datasets[0].data.length == 10) {
                            grafico.data.labels.shift();
                            grafico.data.datasets[0].data.shift();
                        }

                        grafico.data.labels.push(tempo[endpoint]++);
                        grafico.data.datasets[0].data.push(parseFloat(valor));
                        grafico.update();
                    });
                })
                .catch(error => console.error('Erro ao obter dados:', error));
        }

        setInterval(() => {
            obterDados(sensorDigital, 'digital');
        }, 1000);

    </script>
</body>

</html>
