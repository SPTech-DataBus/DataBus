<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOGIN</title>
    <link rel="stylesheet" href="./css/header.css">
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>
    <header class="navbar">
        <a href="index.html" class="logo">
            <img src="imgs/Símbolo.png" alt="Logo DATABUS" width="40" height="40">
            <p>DATA<span>BUS</span></p>
        </a>

        <nav class="menu">
            <a href="index.html">Início</a>
            <a href="../../algoritmos/calculadora-financeira/calculadora.html">Simulador</a>
            <a href="login.html">Login</a>
            <a href="cadastro.html">Cadastro</a>
        </nav>
    </header>

    <main class="login_layout">
        <section class="section_container login painel_form">
            <section class="section_form">
                <div class="form_titulo">
                    <h3>Bem-vindo de volta</h3>
                    <p>Entre com seus dados para acessar a plataforma</p>
                </div>

                <div class="campo_grupo">
                    <label for="ipt_email">E-mail</label>
                    <div class="campo">
                        <svg class="campo_icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <rect x="2" y="4" width="20" height="16" rx="2"></rect>
                            <path d="m22 7-10 6L2 7"></path>
                        </svg>
                        <input type="text" id="ipt_email" placeholder="nome@empresa.com">
                    </div>
                </div>

                <div class="campo_grupo">
                    <label for="ipt_senha">Senha</label>
                    <div class="campo">
                        <svg class="campo_icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <rect x="4" y="11" width="16" height="10" rx="2"></rect>
                            <path d="M8 11V7a4 4 0 0 1 8 0v4"></path>
                            <circle cx="12" cy="16" r="1"></circle>
                        </svg>
                        <input type="password" id="ipt_senha" placeholder="Digite sua senha">
                    </div>
                </div>

                <section class="section_div">
                    <label class="lembrar">
                        <input type="checkbox"> Lembrar acesso
                    </label>

                    <a href="">Esqueci minha senha</a>
                </section>

                <button class="botao_entrar" onclick="realizarLogin()">
                    ENTRAR
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M5 12h14"></path>
                        <path d="m12 5 7 7-7 7"></path>
                    </svg>
                </button>

                <p class="divisor">ou</p>

                <p class="section_p">Ainda não tem acesso? <a href="cadastro.html" class="section_a">Cadastre seu
                        interesse</a></p>

                <span id="msg"></span>
            </section>
        </section>
    </main>
</body>

</html>

<script>
    let tentativas = 0;

    function realizarLogin() {
        let email = ipt_email.value.toLowerCase();
        let senha = ipt_senha.value;

        msg.innerHTML = '';
        let erros = '';

        let email_salvo = 'contato@databus.com';
        let senha_salva = 'Urubu100';


        // VALIDAÇÃO DE EMAIL

        let indiceArroba = email.indexOf("@");
        let comecaArroba = email.startsWith("@");
        let contemEspaco = email.includes(" ");
        let terminaValido = email.endsWith(".com") || email.endsWith(".br");

        if (indiceArroba == -1 || comecaArroba == true ||
            contemEspaco == true || terminaValido == false) {
            erros += `E-mail inválido<br>`;
        }

        // VALIDAÇÃO DE SENHA

        if (senha.length < 8) {
            erros += `A senha precisa ter pelo menos 8 caracteres.<br>`;
        }

        if (senha == senha.toLowerCase()) {
            erros += `A senha precisa ter pelo menos uma letra maiúscula.<br>`;
        }

        if (senha == senha.toUpperCase()) {
            erros += `A senha precisa ter pelo menos uma letra minúscula.<br>`;
        }

        if (erros != '') {
            msg.innerHTML = `
            <div class="mensagem-erro">
                <b>Verifique os dados informados</b>
                <span>${erros}</span>
            </div>`;
        } else {

            // COMPARAÇÃO DE SENHA E EMAIL

            if (senha === senha_salva && email === email_salvo) {
                msg.innerHTML += `Login realizado com sucesso<br>`;
                tentativas = 0;
                // redireciona para a pagina de dashboard quando o login estiver ok
                location.href = "dashboard.html";

            } else {
                tentativas++;
                let restantes = 0;
                for (let contador = tentativas; contador < 3; contador++) {
                    restantes++;
                }

                if (restantes > 0) {
                    msg.innerHTML = `
                    <div class="mensagem-erro">
                        <b>Verifique os dados informados</b>
                        <span>
                            ${erros}
                        </span>
                        <span class="tentativas">
                            Restam ${restantes} tentativa(s).
                        </span>
                    </div>`;
                } else {
                    msg.innerHTML = `
                        <div class="mensagem-erro">
                            <b>Login bloqueado</b>
                            <span>
                                ${erros}
                            </span>
                            <span class="tentativas">
                                 Você atingiu o limite de 3 tentativas.
                            </span>
                        </div>`;
                    /* desabilita a pessoa clicar em email e senha, por estar bloqueado*/
                    ipt_email.disabled = true;
                    ipt_senha.disabled = true;
                }
            }
        }
    }
</script>
