<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - DataBus</title>
    <link rel="icon" type="image/png" href="imgs/Símbolo.png">
    <link rel="stylesheet" href="./css/header.css">
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>
    <header class="navbar">
        <a href="index.html" class="logo">
            <img src="imgs/Símbolo.png" alt="Logo DATABUS" width="40" height="40">
            <p>DATA<span>BUS</span></p>
        </a>

        <nav class="menu">
            <a href="index.html">Início</a>
            <a href="../../algoritmos/calculadora-financeira/calculadora.html">Simulador</a>
            <a href="login.html">Login</a>
            <a href="cadastro.html">Cadastro</a>
        </nav>
    </header>

    <main class="login_layout">
        <section class="section_container login painel_form">
            <section class="section_form">
                <div class="form_titulo">
                    <h3>Bem-vindo de volta</h3>
                    <p>Entre com seus dados para acessar a plataforma</p>
                </div>

                <div class="campo_grupo">
                    <label for="ipt_email">E-mail</label>
                    <div class="campo">
                        <svg class="campo_icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <rect x="2" y="4" width="20" height="16" rx="2"></rect>
                            <path d="m22 7-10 6L2 7"></path>
                        </svg>
                        <input type="text" id="ipt_email" placeholder="nome@empresa.com">
                    </div>
                </div>

                <span id="msg_email"></span>

                <div class="campo_grupo">
                    <label for="ipt_senha">Senha</label>
                    <div class="campo">
                        <svg class="campo_icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <rect x="4" y="11" width="16" height="10" rx="2"></rect>
                            <path d="M8 11V7a4 4 0 0 1 8 0v4"></path>
                            <circle cx="12" cy="16" r="1"></circle>
                        </svg>
                        <input type="password" id="ipt_senha" placeholder="Digite sua senha">
                    </div>
                </div>

                <span id="msg_senha"></span>

                <section class="section_div">
                    <label class="lembrar">
                        <input type="checkbox"> Lembrar acesso
                    </label>

                    <a href="">Esqueci minha senha</a>
                </section>

                <button class="botao_entrar" onclick="realizarLogin()">
                    ENTRAR
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M5 12h14"></path>
                        <path d="m12 5 7 7-7 7"></path>
                    </svg>
                </button>

                <p class="divisor">ou</p>

                <p class="section_p">Ainda não tem acesso? <a href="cadastro.html" class="section_a">Cadastre seu
                        interesse</a></p>

                <span id="msg"></span>
            </section>
        </section>
    </main>
</body>

</html>

<script>
    let tentativas = 0;

    function realizarLogin() {
        let email = ipt_email.value.toLowerCase();
        let senha = ipt_senha.value;

        // limpa as mensagens da tentativa anterior
        msg_email.innerHTML = '';
        msg_senha.innerHTML = '';

        // Envia os dados para o backend via API REST
        // O endpoint POST /usuarios/autenticar será tratado pelo usuarioController.autenticar()
        // que consulta o banco de dados usando o usuarioModel
        fetch("/usuarios/autenticar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                emailServer: email,
                senhaServer: senha
            })
        })
        .then(function (resposta) {
            if (resposta.ok) {
                resposta.json().then(json => {
                    sessionStorage.EMAIL_USUARIO = json.email;
                    sessionStorage.NOME_USUARIO = json.nome;
                    sessionStorage.ID_USUARIO = json.id;
                    window.location = "dashboard.html";
                });
            } else if (resposta.status == 403) {
                tentativas++;
                let restantes = 3 - tentativas;
                if (restantes > 0) {
                    msg_senha.innerHTML = `E-mail ou senha incorretos. Restam ${restantes} tentativa(s).`;
                } else {
                    msg_senha.innerHTML = `Login bloqueado. Você atingiu o limite de 3 tentativas.`;
                    ipt_email.disabled = true;
                    ipt_senha.disabled = true;
                }
            } else {
                resposta.text().then(texto => {
                    console.error(texto);
                    msg_senha.innerHTML = 'Erro no servidor';
                });
            }
        })
        .catch(function (erro) {
            console.error("Erro no login:", erro);
            msg_senha.innerHTML = 'Erro de conexão com o servidor';
        });

        // Previne o comportamento padrão do botão e mensagens locais
        // return false; podemos usar se vocês quiserem porem é descartavel
    }
</script>
